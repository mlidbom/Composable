name: Build and Test
description: Shared setup, build, and test steps for CI and publish workflows

inputs:
  configuration:
    description: Build configuration (Debug or Release)
    required: false
    default: Debug
  pluggable-components:
    description: "Pluggable component combination to test (e.g. SqliteMemory:Microsoft:Newtonsoft:AspNetCore). When not specified, uses the .github-ci config file."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Configure test pluggable components
      shell: bash
      run: |
        # The combination also labels this job's hang-dump artifact. Artifact names must be unique within a run and may not
        # contain a colon, and the matrix runs the same combinations on two operating systems - hence the dash-separated
        # combination here, and the runner OS added where the artifact is uploaded.
        if [ -n "${{ inputs.pluggable-components }}" ]; then
          echo "${{ inputs.pluggable-components }}" > src/TestUsingPluggableComponentCombinations
          echo "COMPZE_TESTED_COMBINATION=$(echo '${{ inputs.pluggable-components }}' | tr ':' '-')" >> "$GITHUB_ENV"
        else
          cp src/TestUsingPluggableComponentCombinations.github-ci src/TestUsingPluggableComponentCombinations
          echo "COMPZE_TESTED_COMBINATION=github-ci-defaults" >> "$GITHUB_ENV"
        fi

    - name: Build
      shell: bash
      run: dotnet build Compze.AllProjects.slnx --configuration ${{ inputs.configuration }}

    - name: Test
      shell: bash
      run: |
        # On Linux, sample machine load throughout the test run so a timeout can be checked against whether the box was
        # actually saturated: vmstat's `r` is the run-queue depth (threads wanting a CPU), `id` is idle CPU%. Against the
        # runner's logical-CPU count, sustained r far above it with id~0 is real oversubscription; r near or below it with
        # idle to spare is not - a timeout is then a code defect, not a starved machine. vmstat (procps) is Linux-only, and
        # the DB matrix that most stresses the box runs only on Linux anyway, so on Windows we just run the tests.
        sample_load=false
        if [ "$RUNNER_OS" = "Linux" ]; then
          sample_load=true
          vmstat -t 1 > vmstat-during-tests.log 2>&1 &
          vmstat_pid=$!
        fi

        # errexit stays OFF for the rest of the step (GitHub runs bash with -e -o pipefail): the load summary below is
        # pure diagnostics and must never decide the step's result - only test_exit does, at the very end. In particular
        # `... | head` closes its pipe early, which SIGPIPEs the upstream `sort` (non-zero under pipefail); under errexit
        # that aborted the step before `exit $test_exit`, failing a passing run at random on whichever leg lost that race.
        set +e
        # --blame-hang turns a hung test run from a silent multi-hour burn into a fast, diagnosable failure. When a test
        # produces no result within the timeout, vstest dumps every thread of the test host and kills it, so this step FAILS
        # with the stacks on disk - rather than hanging until the job's timeout-minutes backstop kills the runner and takes
        # the evidence with it. Without it a hang tells us only which assembly stopped reporting, which is where the
        # 2026-07-24 Sqlite:LightInject:Newtonsoft:NamedPipes hang left us: 107 minutes, one named assembly, no stacks.
        # The timeout is deliberately far above anything real - the whole solution runs in about three minutes and its
        # slowest single assembly executes in under a second - so it can only fire on a genuine hang, never a slow runner.
        # --results-directory collects every project's dump and sequence file in one place for the upload step below.
        dotnet test Compze.AllProjects.slnx --configuration ${{ inputs.configuration }} --no-build -m:1 \
                    --results-directory TestResults --blame-hang --blame-hang-timeout 10min --blame-hang-dump-type full
        test_exit=$?

        if [ "$sample_load" = true ]; then
          kill "$vmstat_pid" 2>/dev/null || true

          echo "===== Machine load during the test run (vmstat) ====="
          nproc | sed 's/^/logical CPUs: /'
          # Only rows whose first field is a number are samples (skips both header lines); the first such row is the
          # since-boot average, skipped too. Column layout: 1=r (run queue), 15=id (idle%), 16=wa (iowait%). Peak/avg are
          # over the WHOLE run - the tail alone only shows the final, lightweight assembly, not the heavy phases.
          awk '$1 ~ /^[0-9]+$/ {
                 n++
                 if (n == 1) next
                 if ($1 > peakr) peakr = $1
                 if (minid == "" || $15 < minid) minid = $15
                 if ($16 > peakwa) peakwa = $16
                 rsum += $1; idsum += $15; c++
               }
               END {
                 if (c > 0) printf "run-queue r: peak=%d avg=%.1f   idle CPU%%: min=%d avg=%.0f   iowait%% peak=%d   (%d samples)\n", peakr, rsum/c, minid, idsum/c, peakwa, c
                 else print "no vmstat samples captured"
               }' vmstat-during-tests.log
          echo "----- busiest 10 samples by run-queue -----"
          awk '$1 ~ /^[0-9]+$/ && NR > 3' vmstat-during-tests.log | sort -k1,1 -nr | head -n 10
        fi

        exit $test_exit

    # A hang dump is written to the runner's disk and dies with the runner, so without this the diagnostics above buy nothing.
    # Uploaded only on failure, and a plain test failure writes no dump - hence if-no-files-found: ignore, which keeps a normal
    # red build from reporting a missing-artifact warning on top of its real failure.
    - name: Upload hang dumps
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: hang-dump-${{ runner.os }}-${{ env.COMPZE_TESTED_COMBINATION }}
        path: TestResults/**
        if-no-files-found: ignore
        retention-days: 7
